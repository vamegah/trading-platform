name: deploy-frontend

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      frontend_bucket:
        required: true
        type: string
      cloudfront_distribution_id:
        required: true
        type: string
      clerk_publishable_key:
        required: true
        type: string
      api_url:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ inputs.api_url }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ inputs.clerk_publishable_key }}
        run: npm run build

      - name: Sync to S3
        run: |
          aws s3 sync frontend/out/ "s3://${{ inputs.frontend_bucket }}/" \
            --delete --no-progress

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ inputs.cloudfront_distribution_id }}" \
            --paths "/*"