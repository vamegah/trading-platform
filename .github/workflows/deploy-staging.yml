name: deploy-staging

# Manual only: run from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-lambdas.yml
    with:
      environment: staging
      artifacts_bucket: trading-staging-lambda-artifacts
      aws_region: us-east-1
    secrets: inherit

  terraform:
    needs: [build]
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: staging
      artifacts_bucket: trading-staging-lambda-artifacts
      aws_region: us-east-1
      tfvars_secret: TFVARS_STAGING
      api_image_uri: ${{ needs.build.outputs.api_image_uri }}
    secrets: inherit

  frontend:
    needs: [terraform]
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: staging
      aws_region: us-east-1
      frontend_bucket: ${{ needs.terraform.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ needs.terraform.outputs.cloudfront_distribution_id }}
      clerk_key_secret: CLERK_PUBLISHABLE_KEY_STAGING
      api_url: ${{ needs.terraform.outputs.api_endpoint }}
    secrets: inherit

  smoke:
    needs: [terraform, frontend]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # API Gateway only routes /api/*, so the health check is /api/health.
      - name: API health
        run: |
          API="${{ needs.terraform.outputs.api_endpoint }}"
          for i in {1..10}; do
            if curl -fsS "$API/api/health" >/dev/null; then
              echo "API healthy"; exit 0
            fi
            echo "Waiting for API… ($i/10)"
            sleep 15
          done
          echo "API failed health check" >&2
          exit 1

