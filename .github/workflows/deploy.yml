name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      image_tag:
        description: Image tag to deploy. Defaults to current commit SHA.
        required: false
        type: string
      apply_infrastructure:
        description: Apply Terraform after planning.
        required: true
        default: false
        type: boolean
      deploy_kubernetes:
        description: Apply Kubernetes manifests after release gates.
        required: true
        default: false
        type: boolean

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository }}/backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository }}/frontend
  DEPLOY_TAG: ${{ inputs.image_tag != '' && inputs.image_tag || github.sha }}

jobs:
  release-candidate:
    name: Release Candidate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      backend-image: ${{ env.BACKEND_IMAGE }}:${{ env.DEPLOY_TAG }}
      frontend-image: ${{ env.FRONTEND_IMAGE }}:${{ env.DEPLOY_TAG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: docker/setup-buildx-action@v3
      - uses: hashicorp/setup-terraform@v3
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Backend release checks
        run: pytest -q
      - name: Compile backend
        run: python -m compileall backend scripts migrations
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend release gates
        run: npm --prefix frontend run test:validate
      - name: Record release candidate evidence
        run: python scripts/production_readiness.py --environment "${{ inputs.environment }}" --output "release-candidate-${{ inputs.environment }}.json"
      - name: Final release-candidate review
        run: python scripts/release_candidate_review.py --evidence-manifest "${{ vars.RELEASE_EVIDENCE_MANIFEST || 'config/release_evidence.example.json' }}" --output "release-review-${{ inputs.environment }}.json"
      - name: Live trading go-live gate
        if: ${{ inputs.environment == 'production' }}
        run: python scripts/go_live_gate.py --environment production --env-file config/prod.env --evidence-manifest "${{ vars.RELEASE_EVIDENCE_MANIFEST || 'config/release_evidence.example.json' }}" --live-requested --fail-closed
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/backend.Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.DEPLOY_TAG }}
            ${{ env.BACKEND_IMAGE }}:${{ inputs.environment }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/docker/frontend.Dockerfile
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.DEPLOY_TAG }}
            ${{ env.FRONTEND_IMAGE }}:${{ inputs.environment }}
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || vars.SMOKE_TEST_BASE_URL || 'http://localhost:8000' }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Generate production change log
        run: git log -1 --pretty=format:"%H %s" > "change-log-${{ inputs.environment }}.txt"
      - name: Attest release evidence
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: release-candidate-${{ inputs.environment }}.json
      - name: Upload release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ inputs.environment }}-${{ env.DEPLOY_TAG }}
          path: |
            release-candidate-${{ inputs.environment }}.json
            release-review-${{ inputs.environment }}.json
            change-log-${{ inputs.environment }}.txt
            frontend/release-evidence/*.json

  infrastructure:
    name: Terraform Plan And Apply
    runs-on: ubuntu-latest
    needs: release-candidate
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials
        if: ${{ vars.AWS_ROLE_TO_ASSUME != '' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Terraform init
        working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infrastructure/terraform
        run: terraform validate
      - name: Plan deployment
        working-directory: infrastructure/terraform
        env:
          TF_VAR_database_password: ${{ secrets.TF_DATABASE_PASSWORD }}
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
        run: terraform plan -input=false -var="environment=${{ inputs.environment }}" -var="image_tag=${{ env.DEPLOY_TAG }}" -out=tfplan
      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ inputs.environment }}-${{ env.DEPLOY_TAG }}
          path: infrastructure/terraform/tfplan
      - name: Terraform apply
        if: ${{ (inputs.apply_infrastructure || vars.APPLY_INFRASTRUCTURE == 'true') && (inputs.environment == 'staging' || github.ref == 'refs/heads/main') }}
        working-directory: infrastructure/terraform
        env:
          TF_VAR_database_password: ${{ secrets.TF_DATABASE_PASSWORD }}
          TF_VAR_aws_account_id: ${{ vars.AWS_ACCOUNT_ID }}
        run: terraform apply -input=false -auto-approve tfplan

  deploy-kubernetes:
    name: Kubernetes Rollout
    runs-on: ubuntu-latest
    needs: [release-candidate, infrastructure]
    if: ${{ inputs.deploy_kubernetes }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure kubeconfig
        run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_B64 }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
      - name: Apply manifests
        run: kubectl apply -f infrastructure/k8s
      - name: Wait for gateway rollout
        run: kubectl rollout status deployment/api-gateway --timeout=180s
      - name: Wait for frontend rollout
        run: kubectl rollout status deployment/frontend --timeout=180s

  smoke:
    name: Deployment Smoke Test
    runs-on: ubuntu-latest
    needs: [release-candidate, infrastructure, deploy-kubernetes]
    if: ${{ always() && vars.SMOKE_TEST_BASE_URL != '' && (needs.deploy-kubernetes.result == 'success' || needs.deploy-kubernetes.result == 'skipped') && needs.infrastructure.result == 'success' }}
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Smoke test deployed gateway
        run: python scripts/smoke_test.py "${{ vars.SMOKE_TEST_BASE_URL }}"

  rollback:
    name: Rollback Runbook
    runs-on: ubuntu-latest
    needs: [release-candidate, infrastructure, deploy-kubernetes, smoke]
    if: ${{ failure() && inputs.environment == 'production' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Print rollback checklist
        run: python scripts/production_readiness.py --rollback-checklist
