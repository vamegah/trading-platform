name: build-lambdas

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      artifacts_bucket:
        required: true
        type: string
      aws_region:
        required: true
        type: string
    outputs:
      build_sha:
        description: "SHA of the build artifacts"
        value: ${{ jobs.build.outputs.build_sha }}

concurrency:
  group: build-lambdas-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region }}
  ARTIFACTS_BUCKET: ${{ inputs.artifacts_bucket }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      build_sha: ${{ steps.meta.outputs.build_sha }}

    steps:
      - uses: actions/checkout@v4

      - name: Record build metadata
        id: meta
        run: |
          echo "build_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - name: Install Docker
        uses: docker/setup-buildx-action@v3

      - name: Prime Docker
        run: docker pull public.ecr.aws/lambda/python:3.12

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Build each zip-packaged Lambda. First argument is the source folder
      # relative to backend/; the zip lands in that folder (see
      # build_one_lambda.sh for the path each Terraform stack references).
      # The researcher Lambda is image-based (4_researcher image_uri), so it
      # has no zip build here.
      - name: Build planner
        run: bash .github/scripts/ci/build_one_lambda.sh services/agents/portfolio_planner planner

      - name: Build tagger
        run: bash .github/scripts/ci/build_one_lambda.sh services/agents/instrument_tagger tagger

      - name: Build reporter
        run: bash .github/scripts/ci/build_one_lambda.sh services/agents/report_writer reporter

      - name: Build charter
        run: bash .github/scripts/ci/build_one_lambda.sh services/agents/chart_maker charter

      - name: Build retirement
        run: bash .github/scripts/ci/build_one_lambda.sh services/agents/retirement_specialist retirement

      - name: Build scheduler
        run: bash .github/scripts/ci/build_one_lambda.sh services/scheduler scheduler

      - name: Build ingest
        run: bash .github/scripts/ci/build_one_lambda.sh services/knowledge_base/ingestion ingest

      - name: Build api
        run: bash .github/scripts/ci/build_one_lambda.sh api_gateway api

      - name: Upload Lambda artifacts
        run: bash .github/scripts/ci/upload_artifacts.sh "$ARTIFACTS_BUCKET" "${GITHUB_SHA}"