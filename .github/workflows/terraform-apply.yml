name: terraform-apply

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      artifacts_bucket:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      tfvars_secret:
        required: true
        type: string
      api_image_uri:
        description: ECR URI of the API Lambda image (from build-lambdas.yml)
        required: false
        type: string
        default: ""
    outputs:
      api_endpoint:
        description: API endpoint from terraform output
        value: ${{ jobs.apply.outputs.api_endpoint }}
      frontend_bucket:
        description: Frontend S3 bucket from terraform output
        value: ${{ jobs.apply.outputs.frontend_bucket }}
      cloudfront_distribution_id:
        description: CloudFront distribution ID from terraform output
        value: ${{ jobs.apply.outputs.cloudfront_distribution_id }}
      cloudfront_url:
        description: Public frontend URL (https://<domain>) from terraform output
        value: ${{ jobs.apply.outputs.cloudfront_url }}

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-apply-${{ inputs.environment }}
  cancel-in-progress: false

env:
  AWS_REGION: ${{ inputs.aws_region }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      api_endpoint: ${{ steps.outputs.outputs.api_endpoint }}
      frontend_bucket: ${{ steps.outputs.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ steps.outputs.outputs.cloudfront_distribution_id }}
      cloudfront_url: ${{ steps.outputs.outputs.cloudfront_url }}

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.9.x"

      - name: Materialise tfvars from secret
        env:
          TFVARS_JSON: ${{ secrets[inputs.tfvars_secret] }}
        run: |
          if [[ -z "$TFVARS_JSON" ]]; then
            echo "Missing secret ${{ inputs.tfvars_secret }}" >&2
            exit 1
          fi
          echo "$TFVARS_JSON" > infrastructure/terraform/envs/${{ inputs.environment }}/terraform.auto.tfvars.json

      # The state bucket and lock table are created once by hand; see
      # infrastructure/terraform/envs/README.md. Their names come from
      # repository variables.
      - name: Terraform init
        working-directory: infrastructure/terraform/envs/${{ inputs.environment }}
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_LOCK_TABLE: ${{ vars.TF_LOCK_TABLE }}
          TF_STATE_REGION: ${{ vars.TF_STATE_REGION }}
          TF_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          for name in TF_STATE_BUCKET TF_LOCK_TABLE TF_STATE_REGION; do
            if [[ -z "${!name}" ]]; then
              echo "Missing repository variable $name" >&2
              exit 1
            fi
          done
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=envs/${TF_ENVIRONMENT}/terraform.tfstate" \
            -backend-config="region=${TF_STATE_REGION}" \
            -backend-config="dynamodb_table=${TF_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Terraform validate
        working-directory: infrastructure/terraform/envs/${{ inputs.environment }}
        run: terraform validate

      - name: Terraform plan
        working-directory: infrastructure/terraform/envs/${{ inputs.environment }}
        env:
          API_IMAGE_URI: ${{ inputs.api_image_uri }}
        run: |
          terraform plan \
            -var="lambda_artifacts_bucket=${{ inputs.artifacts_bucket }}" \
            -var="api_image_uri=${API_IMAGE_URI}" \
            -out=plan.tfplan

      - name: Terraform apply
        working-directory: infrastructure/terraform/envs/${{ inputs.environment }}
        run: terraform apply -auto-approve plan.tfplan

      - name: Capture outputs
        id: outputs
        working-directory: infrastructure/terraform/envs/${{ inputs.environment }}
        run: |
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(terraform output -raw frontend_bucket)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_distribution_id=$(terraform output -raw cloudfront_distribution_id)" >> "$GITHUB_OUTPUT"
          echo "cloudfront_url=$(terraform output -raw cloudfront_url)" >> "$GITHUB_OUTPUT"