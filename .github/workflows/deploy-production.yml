name: deploy-production

# Manual only: run from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'deploy' to confirm"
        required: true
      enable_live_trading:
        description: "This deploy turns on live trading: run the full fail-closed go-live gate"
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.confirm }}" != "deploy" ]]; then
            echo "Confirmation failed" >&2
            exit 1
          fi

  build:
    needs: [guard, m10-gate]
    uses: ./.github/workflows/build-lambdas.yml
    with:
      environment: prod
      artifacts_bucket: trading-prod-lambda-artifacts
      aws_region: us-east-1
    secrets: inherit

  terraform:
    needs: [build]
    uses: ./.github/workflows/terraform-apply.yml
    with:
      environment: prod
      artifacts_bucket: trading-prod-lambda-artifacts
      aws_region: us-east-1
      tfvars_secret: TFVARS_PROD
      api_image_uri: ${{ needs.build.outputs.api_image_uri }}
    secrets: inherit

  # Runs before anything is built or applied. A deploy that turns on live
  # trading (enable_live_trading) must pass the full fail-closed go-live gate.
  # Any other deploy, including a tag push, must keep live trading off.
  m10-gate:
    needs: [guard]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v7
      - name: Live trading stays off
        if: inputs.enable_live_trading != true
        run: |
          fail=0
          for key in LIVE_TRADING_ENABLED REQUIRE_LIVE_INTEGRATIONS; do
            value="$(sed -n "s/^${key}=//p" config/prod.env | tail -n 1 | tr -d '\r\" ' | tr '[:upper:]' '[:lower:]')"
            if [[ "$value" != "false" ]]; then
              echo "::error file=config/prod.env::${key} must be false unless enable_live_trading is set (found '${value:-unset}')"
              fail=1
            fi
          done
          if grep -rniE 'LIVE_TRADING_ENABLED["[:space:]]*=[[:space:]]*"?(true|1|yes)' infrastructure/terraform --include='*.tf'; then
            echo "::error::Terraform turns on LIVE_TRADING_ENABLED; that needs enable_live_trading and the go-live gate"
            fail=1
          fi
          if [[ $fail -eq 0 ]]; then
            echo "::notice::Live trading stays off, so the go-live gate is not required for this deploy"
          fi
          exit $fail
      - uses: actions/setup-python@v7
        if: inputs.enable_live_trading == true
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: inputs.enable_live_trading == true
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Go-live gate
        if: inputs.enable_live_trading == true
        run: |
          python scripts/go_live_gate.py \
            --environment production \
            --env-file config/prod.env \
            --evidence-manifest release_evidence.json \
            --live-requested \
            --fail-closed

  frontend:
    needs: [terraform]
    uses: ./.github/workflows/deploy-frontend.yml
    with:
      environment: prod
      aws_region: us-east-1
      frontend_bucket: ${{ needs.terraform.outputs.frontend_bucket }}
      cloudfront_distribution_id: ${{ needs.terraform.outputs.cloudfront_distribution_id }}
      clerk_key_secret: CLERK_PUBLISHABLE_KEY_PROD
      api_url: ${{ needs.terraform.outputs.api_endpoint }}
    secrets: inherit

  tag:
    needs: [terraform, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # An annotated tag needs a committer identity, which the runner does not set.
      # deployed-prod-* does not match the v*.*.* deploy trigger, and tags pushed
      # with GITHUB_TOKEN do not start workflows, so this cannot loop.
      - name: Annotate release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          tag="deployed-prod-$(date -u +%Y%m%d%H%M)"
          git tag -a "$tag" -m "prod deploy ${GITHUB_SHA}"
          git push origin "refs/tags/$tag"