name: pr-validate

# Checks that complement ci.yml. ci.yml already lints and tests everything that
# installs from the root requirements.txt (api_gateway, agents, knowledge_base, ...)
# and runs terraform fmt/validate on the infrastructure/terraform root module.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Services that are standalone uv projects (own pyproject.toml + uv.lock).
  backend-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend/database
          - backend/services/agents/researcher_agent
          - backend/services/scheduler
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v3

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Sync dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync --frozen

      - name: Ruff
        working-directory: ${{ matrix.service }}
        run: |
          if grep -q "\[tool.ruff\]" pyproject.toml 2>/dev/null || [[ -f ruff.toml ]]; then
            uv run --with ruff ruff check .
          fi

      - name: Pytest
        working-directory: ${{ matrix.service }}
        run: |
          if [[ -d tests ]]; then
            uv run --with pytest pytest -q
          fi

  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run test:unit
      - working-directory: frontend
        run: npm run build

  # Numbered stacks are separate Terraform root modules; ci.yml only validates
  # infrastructure/terraform itself.
  terraform-validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack:
          - 2_sagemaker
          - 3_ingestion
          - 4_researcher
          - 5_database
          - 6_agents
          - 7_frontend
          - 8_enterprise
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
      - name: Terraform init
        working-directory: infrastructure/terraform/${{ matrix.stack }}
        run: terraform init -backend=false -input=false
      - name: Terraform validate
        working-directory: infrastructure/terraform/${{ matrix.stack }}
        run: terraform validate -no-color

  # Builds every zip Lambda the same way build-lambdas.yml does, without AWS
  # access, so packaging failures show up on the PR instead of in a deploy.
  lambda-builds:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: planner, src: services/agents/portfolio_planner, zip: planner_lambda.zip, db: true }
          - { name: tagger, src: services/agents/instrument_tagger, zip: tagger_lambda.zip, db: true }
          - { name: reporter, src: services/agents/report_writer, zip: reporter_lambda.zip, db: true }
          - { name: charter, src: services/agents/chart_maker, zip: charter_lambda.zip, db: true }
          - { name: retirement, src: services/agents/retirement_specialist, zip: retirement_lambda.zip, db: true }
          - { name: scheduler, src: services/scheduler, zip: lambda_function.zip, db: false }
          - { name: ingest, src: services/knowledge_base/ingestion, zip: lambda_function.zip, db: false }
          - { name: api, src: api_gateway, zip: api_lambda.zip, db: false }
    name: lambda-builds (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.4.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prime Docker
        run: docker pull public.ecr.aws/lambda/python:3.12

      - name: Build ${{ matrix.name }}
        run: bash .github/scripts/ci/build_one_lambda.sh "${{ matrix.src }}" "${{ matrix.name }}"

      # Lambda rejects zip packages whose unzipped size is 262,144,000 bytes or more.
      - name: Check the unzipped size
        env:
          ZIP: backend/${{ matrix.src }}/${{ matrix.zip }}
        run: |
          python - <<'PY'
          import collections
          import os
          import sys
          import zipfile

          limit = 262_144_000
          path = os.environ["ZIP"]
          infos = zipfile.ZipFile(path).infolist()
          total = sum(i.file_size for i in infos)
          by_top = collections.Counter()
          for i in infos:
              by_top[i.filename.split("/", 1)[0]] += i.file_size
          print(f"{path}: {os.path.getsize(path) / 1e6:.1f} MB zipped, {total / 1e6:.1f} MB unzipped (limit {limit / 1e6:.1f} MB)")
          print("Largest top-level entries:")
          for name, size in by_top.most_common(15):
              print(f"  {size / 1e6:8.1f} MB  {name}")
          if total >= limit:
              sys.exit(f"{path} is {total / 1e6:.1f} MB unzipped, over the Lambda limit")
          PY

      - name: Check the zip contains the db package
        if: matrix.db
        env:
          ZIP: backend/${{ matrix.src }}/${{ matrix.zip }}
        run: |
          python - <<'PY'
          import os
          import sys
          import zipfile

          names = set(zipfile.ZipFile(os.environ["ZIP"]).namelist())
          missing = [n for n in ("db/__init__.py", "db/client.py", "db/models.py", "db/schemas.py", "lambda_handler.py") if n not in names]
          if missing:
              sys.exit(f"{os.environ['ZIP']} is missing: {', '.join(missing)}")
          print(f"{os.environ['ZIP']}: {len(names)} files, db package present")
          PY