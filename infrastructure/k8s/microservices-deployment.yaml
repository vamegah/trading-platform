apiVersion: apps/v1
kind: Deployment
metadata:
  name: execution-service
  labels:
    app: execution-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: execution-service
  template:
    metadata:
      labels:
        app: execution-service
    spec:
      containers:
        - name: execution-service
          image: trading-platform/backend:latest
          command: ["uvicorn", "backend.services.execution_service.main:app"]
          args: ["--host", "0.0.0.0", "--port", "8021"]
          ports:
            - containerPort: 8021
          envFrom:
            - configMapRef:
                name: trading-platform-config
            - secretRef:
                name: trading-platform-external-apis
          readinessProbe:
            httpGet:
              path: /ready
              port: 8021
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: execution-service
spec:
  selector:
    app: execution-service
  ports:
    - name: http
      port: 80
      targetPort: 8021
---
