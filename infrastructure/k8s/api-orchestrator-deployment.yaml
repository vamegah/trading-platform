apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-orchestrator
  labels:
    app: api-orchestrator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-orchestrator
  template:
    metadata:
      labels:
        app: api-orchestrator
    spec:
      containers:
        - name: api-orchestrator
          image: trading-platform/api-orchestrator:latest
          command:
            - uvicorn
            - backend.services.api_orchestrator.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8010"
          ports:
            - containerPort: 8010
          envFrom:
            - configMapRef:
                name: trading-platform-config
            - secretRef:
                name: trading-platform-external-apis
          readinessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8010
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "2Gi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-orchestrator
spec:
  selector:
    app: api-orchestrator
  ports:
    - name: http
      port: 80
      targetPort: 8010
