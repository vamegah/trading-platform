apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-api-worker
  labels:
    app: external-api-worker
    app.kubernetes.io/component: event-consumer
spec:
  replicas: 2
  selector:
    matchLabels:
      app: external-api-worker
  template:
    metadata:
      labels:
        app: external-api-worker
        app.kubernetes.io/component: event-consumer
    spec:
      containers:
        - name: external-api-worker
          image: trading-platform/backend:latest
          command: ["python", "-m", "backend.services.api_orchestrator.worker"]
          envFrom:
            - configMapRef:
                name: trading-platform-config
            - secretRef:
                name: trading-platform-external-apis
---
