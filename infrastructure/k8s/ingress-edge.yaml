apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: trading-platform-edge
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/wafv2-acl-arn: "${WAFV2_WEB_ACL_ARN}"
    alb.ingress.kubernetes.io/certificate-arn: "${ACM_CERTIFICATE_ARN}"
    external-dns.alpha.kubernetes.io/hostname: "${PUBLIC_HOSTNAME}"
spec:
  rules:
    - host: "${PUBLIC_HOSTNAME}"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /signals
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /portfolio
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /execution
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /backtest
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /marketplace
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /personalization
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /orchestrator
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /reliability
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-delivery-contract
data:
  cdn: "CloudFront terminates public traffic before the ingress load balancer."
  waf: "AWS WAF is attached at CloudFront and ALB using WAFV2_WEB_ACL_ARN."
  identity: "Auth0 JWTs are validated at the gateway and propagated with user/service headers."
  ddos: "AWS Shield, WAF managed rules, and Redis-backed API rate limits protect ingress."
