apiVersion: v1
kind: Secret
metadata:
  name: external-secret-provider-placeholder
  labels:
    app.kubernetes.io/name: trading-platform
type: Opaque
stringData:
  README: "Replace with ExternalSecrets/Secrets Store CSI Driver resources for Vault, AWS Secrets Manager, or cloud KMS-backed secrets."
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: production-secret-contract
data:
  required_keys: |
    DATABASE_URL
    REDIS_URL
    SECRET_KEY
    ENCRYPTION_KEY
    KMS_KEY_ID
    AUDIT_STORE_URL
    SECRET_STORE_URL
    POLYGON_API_KEY
    ALPHA_VANTAGE_API_KEY
    ALPACA_API_KEY
    ALPACA_API_SECRET
    IBKR_ACCOUNT_ID
    BROKER_ENCRYPTION_KEY_ID
